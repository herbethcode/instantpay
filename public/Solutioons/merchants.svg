<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Empowering over 1000 Tanzanian merchants">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#dbe9f5"/></linearGradient>
  </defs>
  <rect width="600" height="440" rx="24" fill="url(#mbg)"/>
  <circle cx="300" cy="210" r="180" fill="#dceaf5" opacity="0.7"/>

  <!-- storefront -->
  <g>
    <rect x="120" y="170" width="220" height="190" rx="10" fill="#ffffff" stroke="#cdd9e3" stroke-width="2"/>
    <!-- awning -->
    <path d="M104 170 h252 v-14 a10 10 0 0 0 -10 -10 H114 a10 10 0 0 0 -10 10 z" fill="#3f6b86"/>
    <g fill="#6f9cba">
      <path d="M104 170 h36 l-6 26 h-30 z"/><path d="M176 170 h36 l-6 26 h-30 z"/><path d="M248 170 h36 l-6 26 h-30 z"/><path d="M320 170 h36 l-6 26 h-30 z" transform="translate(-4,0)"/>
    </g>
    <!-- door + windows -->
    <rect x="206" y="262" width="48" height="98" rx="6" fill="#cfe0ee"/>
    <rect x="140" y="214" width="48" height="40" rx="6" fill="#d4eef2"/>
    <rect x="272" y="214" width="48" height="40" rx="6" fill="#d4eef2"/>
    <!-- sign -->
    <path d="M192 230 a8 8 0 1 1 11 0 a8 8 0 1 0 11 0" fill="none" stroke="#ea2429" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- growth chart -->
  <g transform="translate(370,196)">
    <rect x="0" y="0" width="172" height="150" rx="12" fill="#ffffff" stroke="#cdd9e3" stroke-width="2"/>
    <g fill="#9bbdd4"><rect x="22" y="86" width="22" height="44" rx="3"/><rect x="58" y="66" width="22" height="64" rx="3"/><rect x="94" y="44" width="22" height="86" rx="3"/></g>
    <rect x="130" y="24" width="22" height="106" rx="3" fill="#2faa56"/>
    <path d="M24 96 L70 70 L106 50 L142 24" fill="none" stroke="#ea2429" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M142 24 l-14 2 m14 -2 l-2 14" fill="none" stroke="#ea2429" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 1,000+ badge -->
  <g transform="translate(118,86)">
    <rect x="0" y="0" width="120" height="56" rx="28" fill="#2f5266"/>
    <text x="60" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">1,000+</text>
    <text x="60" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bcd6e6">Merchants</text>
  </g>

  <!-- coin -->
  <circle cx="470" cy="120" r="30" fill="#f5c518" stroke="#d9ab10" stroke-width="4"/>
  <text x="470" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9c7a08">TZS</text>
  <ellipse cx="300" cy="384" rx="170" ry="14" fill="#c3d6e6" opacity="0.45"/>
</svg>
