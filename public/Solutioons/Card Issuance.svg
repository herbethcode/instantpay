<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Card issuance">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="card2a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f9cba"/><stop offset="1" stop-color="#3f6b86"/></linearGradient>
    <linearGradient id="card2b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f5266"/><stop offset="1" stop-color="#1e3a47"/></linearGradient>
  </defs>
  <rect width="480" height="480" rx="32" fill="url(#cbg)"/>
  <circle cx="240" cy="240" r="172" fill="#dceaf5"/>

  <!-- back card -->
  <g transform="rotate(-16 240 250)">
    <rect x="150" y="150" width="190" height="118" rx="16" fill="url(#card2b)"/>
    <rect x="168" y="174" width="34" height="26" rx="5" fill="#f5c518"/>
    <rect x="168" y="226" width="120" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
  </g>
  <!-- front card -->
  <g transform="rotate(8 240 270)">
    <rect x="150" y="210" width="200" height="124" rx="16" fill="url(#card2a)"/>
    <rect x="170" y="236" width="36" height="28" rx="5" fill="#f5c518"/>
    <path d="M214 244 a8 8 0 1 1 11 0 a8 8 0 1 0 11 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="318" y="252" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">InstantPay</text>
    <rect x="170" y="292" width="150" height="9" rx="4.5" fill="#ffffff" opacity="0.8"/>
    <rect x="170" y="308" width="96" height="9" rx="4.5" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- sparkles -->
  <g fill="#f5c518">
    <path d="M360 150 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z"/>
    <path d="M120 300 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
  </g>
  <ellipse cx="240" cy="412" rx="120" ry="16" fill="#c3d6e6" opacity="0.5"/>
</svg>
