<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" width="440" height="540" role="img" aria-label="Building Tanzania's digital payment future">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3fb"/>
      <stop offset="1" stop-color="#d3e8f7"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5266"/>
      <stop offset="1" stop-color="#23404f"/>
    </linearGradient>
  </defs>

  <rect width="440" height="540" rx="28" fill="url(#abg)"/>
  <circle cx="220" cy="250" r="180" fill="#ffffff" opacity="0.45"/>

  <!-- floating coins -->
  <g>
    <circle cx="78" cy="150" r="26" fill="#f5c518" stroke="#d9ab10" stroke-width="3"/>
    <text x="78" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9c7a08">$</text>
    <circle cx="372" cy="330" r="20" fill="#f5c518" stroke="#d9ab10" stroke-width="3"/>
    <text x="372" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9c7a08">$</text>
  </g>

  <!-- card -->
  <g transform="rotate(-16 96 360)">
    <rect x="44" y="330" width="120" height="76" rx="11" fill="#4d7793"/>
    <rect x="58" y="350" width="26" height="19" rx="3" fill="#f5c518"/>
    <rect x="58" y="380" width="84" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="58" y="392" width="50" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- shadow under phone -->
  <ellipse cx="232" cy="486" rx="96" ry="16" fill="#b9d2e6" opacity="0.7"/>

  <!-- phone -->
  <g>
    <rect x="150" y="70" width="170" height="330" rx="30" fill="url(#phone)" stroke="#1b333f" stroke-width="3"/>
    <rect x="162" y="84" width="146" height="302" rx="20" fill="#f5fafd"/>
    <!-- app header -->
    <g transform="translate(180,104)">
      <path d="M4 12 a8 8 0 1 1 11 0 a8 8 0 1 0 11 0" fill="none" stroke="#ea2429" stroke-width="5" stroke-linecap="round"/>
      <text x="36" y="16" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a47">InstantPay</text>
    </g>
    <!-- success circle -->
    <circle cx="235" cy="210" r="44" fill="#e7f6ec" stroke="#2faa56" stroke-width="4"/>
    <path d="M216 210 l13 13 l24 -27" fill="none" stroke="#2faa56" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="235" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a47">TZS 50,000</text>
    <text x="235" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b7383">Payment Successful</text>
    <rect x="180" y="338" width="110" height="30" rx="15" fill="#4d7793"/>
    <text x="235" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Done</text>
  </g>

  <!-- location pin (Tanzania) -->
  <g transform="translate(338,150)">
    <path d="M20 0 a20 20 0 0 1 20 20 c0 15 -20 34 -20 34 c0 0 -20 -19 -20 -34 a20 20 0 0 1 20 -20 z" fill="#2faa56"/>
    <circle cx="20" cy="20" r="8" fill="#ffffff"/>
  </g>
</svg>
