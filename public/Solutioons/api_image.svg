<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Card processing and payment APIs">
  <defs>
    <linearGradient id="apibg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="apicard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f9cba"/><stop offset="1" stop-color="#3f6b86"/></linearGradient>
  </defs>
  <rect width="480" height="480" rx="32" fill="url(#apibg)"/>
  <circle cx="240" cy="240" r="172" fill="#dceaf5"/>

  <!-- connecting nodes -->
  <g stroke="#9bbdd4" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round">
    <line x1="240" y1="240" x2="110" y2="120"/><line x1="240" y1="240" x2="372" y2="118"/>
    <line x1="240" y1="240" x2="106" y2="360"/><line x1="240" y1="240" x2="376" y2="356"/>
  </g>
  <g>
    <circle cx="110" cy="120" r="26" fill="#ffffff" stroke="#cdd9e3" stroke-width="2"/>
    <path d="M99 120 l9 9 l14 -16" fill="none" stroke="#2faa56" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="372" cy="118" r="26" fill="#ffffff" stroke="#cdd9e3" stroke-width="2"/>
    <rect x="362" y="108" width="20" height="16" rx="3" fill="none" stroke="#3f6b86" stroke-width="3"/><path d="M366 108 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#3f6b86" stroke-width="3"/>
    <circle cx="106" cy="360" r="26" fill="#ffffff" stroke="#cdd9e3" stroke-width="2"/>
    <text x="106" y="368" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#3f6b86">&#123;&#125;</text>
    <circle cx="376" cy="356" r="26" fill="#ffffff" stroke="#cdd9e3" stroke-width="2"/>
    <g fill="none" stroke="#f5a623" stroke-width="3"><circle cx="376" cy="356" r="9"/><path d="M376 343 v-5 M376 374 v-5 M363 356 h-5 M394 356 h-5"/></g>
  </g>

  <!-- central card -->
  <g transform="rotate(-8 240 240)">
    <rect x="160" y="196" width="160" height="100" rx="14" fill="url(#apicard)"/>
    <rect x="176" y="216" width="30" height="22" rx="4" fill="#f5c518"/>
    <rect x="176" y="252" width="110" height="7" rx="3.5" fill="#ffffff" opacity="0.8"/>
    <rect x="176" y="266" width="70" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>
    <path d="M264 216 a9 9 0 1 1 12 0 a9 9 0 1 0 12 0" fill="none" stroke="#ea2429" stroke-width="4" stroke-linecap="round"/>
  </g>
  <ellipse cx="240" cy="408" rx="120" ry="16" fill="#c3d6e6" opacity="0.5"/>
</svg>
