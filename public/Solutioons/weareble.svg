<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Wearable payments">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
  <rect width="480" height="480" rx="32" fill="url(#wbg)"/>
  <circle cx="240" cy="240" r="172" fill="#dceaf5"/>

  <!-- payment reader -->
  <g>
    <rect x="286" y="150" width="118" height="180" rx="20" fill="#3f6b86"/>
    <rect x="300" y="168" width="90" height="60" rx="8" fill="#d4eef2"/>
    <text x="345" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a47">PAY</text>
    <circle cx="345" cy="268" r="22" fill="#2faa56"/>
    <path d="M333 268 l8 8 l16 -18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- smartwatch -->
  <g>
    <rect x="92" y="120" width="34" height="84" rx="16" fill="#4d7793"/>
    <rect x="92" y="276" width="34" height="84" rx="16" fill="#4d7793"/>
    <rect x="66" y="178" width="86" height="124" rx="22" fill="#23404f" stroke="#1b333f" stroke-width="3"/>
    <rect x="78" y="190" width="62" height="100" rx="14" fill="#f5fafd"/>
    <path d="M97 224 a7 7 0 1 1 10 0 a7 7 0 1 0 10 0" fill="none" stroke="#ea2429" stroke-width="4" stroke-linecap="round"/>
    <text x="109" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a47">TZS 5,000</text>
    <circle cx="155" cy="184" r="6" fill="#6f9cba"/>
  </g>

  <!-- NFC waves between watch and reader -->
  <g fill="none" stroke="#4d7793" stroke-width="5" stroke-linecap="round">
    <path d="M186 240 a26 26 0 0 1 0 0 M192 218 a30 30 0 0 1 0 44"/>
    <path d="M214 206 a46 46 0 0 1 0 68"/>
    <path d="M236 196 a62 62 0 0 1 0 88" opacity="0.6"/>
  </g>
  <ellipse cx="240" cy="408" rx="120" ry="16" fill="#c3d6e6" opacity="0.5"/>
</svg>
